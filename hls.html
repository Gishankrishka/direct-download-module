<!doctype html>
<html><head><meta charset="utf-8"><title>HLS stream downloader</title><link rel="stylesheet" href="ui.css"></head>
<body><div class="page" style="max-width:820px">
  <h1>HLS stream downloader</h1>
  <p class="muted">Downloads every segment of an <code>.m3u8</code> stream and joins them into one file.</p>
  <label class="fld">Playlist URL (.m3u8)<input id="url" type="text" autocomplete="off"></label>
  <label class="fld">Referer (the page that plays the video)<input id="referer" type="text" autocomplete="off"></label>
  <div class="bar" style="position:static">
    <button id="load" class="primary">Load playlist</button>
    <button id="dashboard">Open dashboard</button>
    <span id="info" class="muted"></span>
  </div>
  <div id="opts" hidden>
    <label class="fld">Quality<select id="quality"></select></label>
    <label class="fld">File name (saved in your Downloads folder)<input id="name" type="text" autocomplete="off"></label>
    <label><input type="checkbox" id="skip"> Skip segments that fail (the video may glitch instead of the download stopping)</label>
    <div class="bar" style="position:static">
      <button id="start" class="primary">Start download</button>
      <button id="cancel" hidden>Cancel</button>
    </div>
  </div>
  <progress id="bar" max="100" value="0" hidden style="width:100%"></progress>
  <div id="log" style="margin-top:8px;white-space:pre-wrap"></div>
</div>
<script src="ffmpeg.js"></script><script src="hls-core.js"></script><script src="hls.js"></script></body></html>

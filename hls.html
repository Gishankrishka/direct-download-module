<!doctype html>
<html><head><meta charset="utf-8"><title>HLS download</title><link rel="stylesheet" href="ui.css"></head>
<body><div class="page" style="max-width:420px;padding:12px">
  <h1 style="font-size:13px;margin:0 0 8px">HLS Download</h1>
  <div id="fileName" class="muted" style="font-size:12px;margin-bottom:8px;word-break:break-all"></div>
  <progress id="bar" max="100" value="0" style="width:100%"></progress>
  <div id="status" class="muted" style="font-size:11px;margin-top:6px"></div>
  <div id="detail" class="muted" style="font-size:11px"></div>
  <div style="margin-top:10px;display:flex;gap:6px;justify-content:flex-end">
    <button id="dashboard" style="padding:4px 10px;font-size:12px">Open Dashboard</button>
    <button id="cancel" style="padding:4px 10px;font-size:12px">Cancel</button>
  </div>
</div>
<script src="ffmpeg.js"></script><script src="hls-core.js"></script><script src="hls.js"></script></body></html>

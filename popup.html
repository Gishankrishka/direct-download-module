<!doctype html>
<html><head><meta charset="utf-8"><title>Direct Download Module</title><link rel="stylesheet" href="ui.css"></head>
<body class="popup">
  <header class="header">
    <div class="title-row">
      <div class="icon-badge" aria-hidden="true">↓</div>
      <div>
        <h1>Direct Download Module</h1>
        <div class="subtitle">Download links, media & HLS streams</div>
      </div>
    </div>
  </header>

  <form id="urlForm" class="fld">
    <label for="url">Download URL</label>
    <div class="row" style="gap:8px">
      <input id="url" type="url" placeholder="Paste a URL to download…" autocomplete="off" style="flex:1">
      <button type="submit" class="btn primary">Download</button>
    </div>
  </form>

  <div class="row" style="gap:8px; margin-top:4px">
    <button id="all" class="btn" style="flex:1">All links</button>
    <button id="sel" class="btn" style="flex:1">Selected</button>
    <button id="hls" class="btn" style="flex:1">HLS downloader</button>
    <button id="dashboard" class="btn" style="flex:1">Dashboard</button>
  </div>

  <div id="youtube" class="fld" hidden>
    <button id="youtubeDownload" class="btn primary" style="width:100%">Download YouTube video</button>
  </div>

  <label class="inline fld" style="margin-top:8px">
    <input type="checkbox" id="enabled" checked>
    <span>Enable extension</span>
  </label>

  <label class="inline fld">
    <input type="checkbox" id="saveAs">
    <span>Ask where to save each file</span>
  </label>

  <h2>Media detected on this tab <span id="count" class="subtle"></span></h2>
  <ul id="media" class="media-list"></ul>

  <div id="msg" class="msg"></div>
  <script src="popup.js"></script>
</body></html>
